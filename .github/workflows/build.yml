name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.9"
          channel: "stable"
      - name: Generate fresh Android project
        run: |
          rm -rf android/
          flutter create . --platforms android --org com.chumian --project-name chumian_music
      - name: Apply custom Android config
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          GRADLE=android/app/build.gradle.kts
          # Add permissions
          sed -i '/<manifest/a\    <uses-permission android:name="android.permission.INTERNET"/>' $MANIFEST
          sed -i '/<manifest/a\    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>' $MANIFEST
          sed -i '/<manifest/a\    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO"/>' $MANIFEST
          sed -i '/<manifest/a\    <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>' $MANIFEST
          sed -i '/<manifest/a\    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK"/>' $MANIFEST
          sed -i '/<manifest/a\    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>' $MANIFEST
          sed -i '/<manifest/a\    <uses-permission android:name="android.permission.WAKE_LOCK"/>' $MANIFEST
          # Set app label
          sed -i 's/android:label="[^"]*"/android:label="初眠音乐"/' $MANIFEST
          # Set minSdk and applicationId (Kotlin DSL)
          sed -i 's/minSdk = [0-9]*/minSdk = 24/' $GRADLE
          sed -i 's/applicationId = "[^"]*"/applicationId = "com.chumian.music"/' $GRADLE
      - name: Build APK
        run: |
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: chumian-music-apk
          path: build/app/outputs/flutter-apk/*.apk
