name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.9"
          channel: "stable"
      - name: Generate Android project
        run: |
          rm -rf android/
          flutter create . --platforms android --org com.chumian --project-name chumian_music
      - name: Patch Android config
        run: |
          MF=android/app/src/main/AndroidManifest.xml
          GR=android/app/build.gradle.kts
          sed -i '/<manifest/a\    <uses-permission android:name="android.permission.INTERNET"/>' $MF
          sed -i '/<manifest/a\    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>' $MF
          sed -i '/<manifest/a\    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO"/>' $MF
          sed -i '/<manifest/a\    <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>' $MF
          sed -i '/<manifest/a\    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK"/>' $MF
          sed -i '/<manifest/a\    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>' $MF
          sed -i '/<manifest/a\    <uses-permission android:name="android.permission.WAKE_LOCK"/>' $MF
          sed -i 's/android:label="[^"]*"/android:label="chumian_music"/' $MF
          sed -i 's/^[[:space:]]*minSdk = .*/        minSdk = 24/' $GR
          sed -i 's/applicationId = "[^"]*"/applicationId = "com.chumian.music"/' $GR
      - name: Fix plugin namespaces
        run: |
          flutter pub get
          # Fix on_audio_query_android missing namespace
          find ~/.pub-cache -path "*/on_audio_query_android*/android/build.gradle" | while read f; do
            if ! grep -q "namespace" "$f"; then
              sed -i '0,/^android {/s//android {\n    namespace "com.onaudioquery"/' "$f"
            fi
          done
          # Fix any other plugin missing namespace
          find ~/.pub-cache -path "*/android/build.gradle" | while read f; do
            if grep -q "^android {" "$f" && ! grep -q "namespace" "$f"; then
              sed -i '0,/^android {/s//android {\n    namespace "com.plugin.fix"/' "$f"
            fi
          done
      - name: Build APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: chumian-music-apk
          path: build/app/outputs/flutter-apk/*.apk
