name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {java-version: '17', distribution: 'temurin'}
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.44.9', channel: 'stable'}
      - run: flutter create . --platforms android --org com.chumian --project-name chumian_music
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with: {name: chumian-music-apk, path: build/app/outputs/flutter-apk/*.apk}
